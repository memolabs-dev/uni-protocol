name: "UNI Verify"
description: "Verify UNI outcome contracts (Outcome Assurance). Downloads the release binary for the runner platform; builds nothing."
author: "UNI contributors"

inputs:
  contract:
    description: "Path to the .uni contract to verify"
    required: true
  version:
    description: "UNI release tag to download"
    required: false
    default: "v0.9.4"
  repository:
    description: "owner/repo hosting UNI releases (replace when publishing your own fork)"
    required: false
    default: "memolabs-dev/uni-protocol"
  report-to-summary:
    description: "Append the stable UNI Assurance view to the job summary"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Install uni
      shell: bash
      run: |
        set -euo pipefail
        case "$RUNNER_OS" in
          Linux)   target=x86_64-unknown-linux-gnu ;;
          macOS)   if [ "$RUNNER_ARCH" = "arm64" ]; then target=aarch64-apple-darwin; else target=x86_64-apple-darwin; fi ;;
          Windows) target=x86_64-pc-windows-msvc ;;
          *) echo "unsupported runner OS: $RUNNER_OS" >&2; exit 1 ;;
        esac
        bin_dir="$RUNNER_TEMP/uni-bin"
        archive="$bin_dir/uni.tar.gz"
        mkdir -p "$bin_dir"
        url="https://github.com/${{ inputs.repository }}/releases/download/${{ inputs.version }}/uni-${target}.tar.gz"
        echo "downloading $url"
        # Bounded retry. A release asset is not immediately downloadable after
        # the tag is pushed, so a job that runs in the same breath as the tag
        # races it; a transient CDN miss looks identical. Both are worth six
        # attempts before failing, and the failure still names the URL.
        for attempt in 1 2 3 4 5 6; do
          if curl -fsSL "$url" -o "$archive"; then
            break
          fi
          if [ "$attempt" = 6 ]; then
            echo "could not download $url after $attempt attempts" >&2
            exit 1
          fi
          echo "attempt $attempt failed, retrying in 10s" >&2
          sleep 10
        done
        magic="$(od -An -tx1 -N2 "$archive" | tr -d ' \n')"
        case "$magic" in
          1f8b)
            tar -xzf "$archive" -C "$bin_dir"
            ;;
          504b)
            # v0.9.4 packaged the Windows binary as ZIP but named it .tar.gz.
            # Keep the published asset usable while future releases use gzip.
            if [ "$RUNNER_OS" != "Windows" ]; then
              echo "unexpected ZIP archive for $RUNNER_OS: $url" >&2
              exit 1
            fi
            legacy_zip="$bin_dir/uni.zip"
            mv "$archive" "$legacy_zip"
            export UNI_ARCHIVE="$legacy_zip" UNI_BIN_DIR="$bin_dir"
            pwsh -NoLogo -NoProfile -NonInteractive -Command \
              'Expand-Archive -LiteralPath $env:UNI_ARCHIVE -DestinationPath $env:UNI_BIN_DIR -Force'
            rm -f "$legacy_zip"
            ;;
          *)
            echo "unsupported archive format from $url (magic=$magic)" >&2
            exit 1
            ;;
        esac
        rm -f "$archive"
        if [ ! -x "$bin_dir/uni" ] && [ ! -f "$bin_dir/uni.exe" ]; then
          echo "archive did not contain the uni binary: $url" >&2
          exit 1
        fi
        echo "$bin_dir" >> "$GITHUB_PATH"
    - name: Verify
      id: verify
      shell: bash
      continue-on-error: true
      run: |
        set -euo pipefail
        uni verify "${{ inputs.contract }}"
        echo "exit=0" >> "$GITHUB_OUTPUT"
    - name: Explain the drift
      if: ${{ steps.verify.outcome == 'failure' }}
      shell: bash
      run: |
        # A claim that stopped applying lands as an inline annotation on the
        # file that moved, so the pull request shows why, not just that.
        uni explain --annotations || true
        {
          echo "### Why the proof stopped applying"
          echo ""
          echo '```'
          uni explain || true
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
    - name: Fail the check
      if: ${{ steps.verify.outcome == 'failure' }}
      shell: bash
      run: exit 1
    - name: Assurance summary
      if: ${{ inputs.report-to-summary == 'true' }}
      shell: bash
      run: uni report >> "$GITHUB_STEP_SUMMARY"

branding:
  icon: "check-circle"
  color: "green"
