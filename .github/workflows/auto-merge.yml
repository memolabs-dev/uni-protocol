# For in-repository pull requests from the two currently trusted maintainers.
# This workflow deliberately never checks out PR code and never runs PR-supplied
# commands or expressions. The required CI check decides whether GitHub merges.
name: Enable auto-merge

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, unlabeled, labeled, converted_to_draft]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable:
    name: Enable merge after required CI
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.pull_request.user.login == 'drop-agent-bot' ||
       github.event.pull_request.user.login == 'guillaume-flambard') &&
      !contains(github.event.pull_request.labels.*.name, 'hold-merge')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enable GitHub auto-merge without bypassing protection
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --merge

  hold:
    name: Pause existing auto-merge on request
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.pull_request.user.login == 'drop-agent-bot' ||
       github.event.pull_request.user.login == 'guillaume-flambard') &&
      (github.event.pull_request.draft ||
       contains(github.event.pull_request.labels.*.name, 'hold-merge'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Disarm native auto-merge only if already armed
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          armed="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json autoMergeRequest --jq '.autoMergeRequest != null')"
          if [ "$armed" = "true" ]; then
            gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --disable-auto
          fi
