name: release

# Cross-compiled release binaries. Triggered by pushing a version tag
# (git tag v0.9.5 && git push origin v0.9.5). The action in
# adapters/github/action.yml downloads these assets by target triple.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cross linker (linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --release -p uni-cli --target ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create, extract-verify and hash real gzip tar archive
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/uni"
          if [ "$RUNNER_OS" = "Windows" ]; then binary="$binary.exe"; fi
          archive="uni-${{ matrix.target }}.tar.gz"
          python scripts/release_archive.py package \
            --target "${{ matrix.target }}" --binary "$binary" --archive "$archive"
          python scripts/release_archive.py verify \
            --target "${{ matrix.target }}" --binary "$binary" --archive "$archive"
          python -m unittest discover -s scripts/tests -p 'test_release_archive.py'
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            uni-${{ matrix.target }}.tar.gz
            uni-${{ matrix.target }}.tar.gz.sha256
