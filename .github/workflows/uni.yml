name: uni

# All jobs run on disposable GitHub-hosted runners. No repository workflow
# executes third-party build scripts on maintainer-operated infrastructure.
on: [push, pull_request]

concurrency:
  group: uni-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Core portability: the crates must compile and their unit tests must pass on
  # every supported platform. The shell verifier is platform-gated (`sh -c` on
  # POSIX, `cmd /C` on Windows) and timeouts are native.
  matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ matrix.os }}-cargo-
      - name: Build
        run: cargo build --release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Portable release archive regression fixtures
        run: python -m unittest discover -s scripts/tests -p 'test_release_archive.py'
      - name: Unit tests (portable)
        run: cargo test --lib
      # CLI integration tests drive the shell verifier with POSIX commands
      # (true, false, grep, sleep). They are POSIX-only by construction, and
      # pretending otherwise would be a lie in the matrix.
      - name: Integration tests (POSIX only)
        if: runner.os != 'Windows'
        run: cargo test
      - name: Verify portable examples
        if: runner.os != 'Windows'
        run: |
          ./target/release/uni verify examples/hello/hello.uni
          ./target/release/uni verify examples/multi/multi.uni
          ./target/release/uni verify examples/booking/booking.uni
        shell: bash
      - name: UNI Assurance (PR check view)
        if: matrix.os == 'ubuntu-latest'
        run: ./target/release/uni report >> "$GITHUB_STEP_SUMMARY"
        shell: bash

  # Examples that need a POSIX shell or a language runtime: forbid (grep),
  # python (unittest), node (node --test).
  examples-posix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: Verify POSIX-shell examples
        run: |
          ./target/release/uni verify examples/forbid/forbid.uni
          ./target/release/uni verify examples/python/contract.uni
          ./target/release/uni verify examples/nodejs/contract.uni
          ./target/release/uni verify examples/artifact/artifact.uni
      - name: Registry trust boundary unchanged
        run: ./target/release/uni doctor
      - name: Independent-oracle synthetic benchmark integrity tests
        run: python3 -m unittest discover -s experiments/assurance-bench/tests -p 'test_*.py'
      - name: Aftershock read-only observer pilot (synthetic SQLite only)
        run: python3 -m unittest discover -s experiments/aftershock -p 'test_*.py'

  # The published action, exercised for real: it downloads the release binary
  # for the runner platform. The artifact example runs no runtime at all
  # (file-hash), so this isolates the download-and-run path. No `version` is
  # passed on purpose: the point is to exercise the DEFAULT the action ships,
  # which a pinned old tag would never test.
  action-smoke:
    # Skipped on tag pushes. A tag points at a commit the branch push already
    # tested, and the asset this job downloads is produced by the tag's own
    # release workflow, which has not finished when this starts. That race made
    # the tag commits for v0.9.2 and v0.9.3 go red on an unrelated job.
    if: github.ref_type != 'tag'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify with the published action (default version)
        uses: ./adapters/github
        with:
          contract: examples/artifact/artifact.uni
      - name: Exercise the future Windows release archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "$env:RUNNER_TEMP/uni-windows-smoke.tar.gz"
          $unpack = "$env:RUNNER_TEMP/uni-windows-smoke"
          tar -czf $archive -C "$env:RUNNER_TEMP/uni-bin" uni.exe
          $bytes = [System.IO.File]::ReadAllBytes($archive)
          if ($bytes[0] -ne 0x1f -or $bytes[1] -ne 0x8b) {
            throw "Windows release archive is not gzip"
          }
          New-Item -ItemType Directory -Force -Path $unpack | Out-Null
          tar -xzf $archive -C $unpack
          if (-not (Test-Path "$unpack/uni.exe")) {
            throw "Windows release archive does not contain uni.exe"
          }

  # Hygiene, on one platform because these are platform-independent. Both were
  # green-ish by accident before (rustc warned nothing; clippy and rustfmt were
  # never run), so they are asserted here rather than trusted.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings
      - name: The Spec Kit constitution copy is not stale
        run: |
          # The copy is generated from constitution.md. If this fails, run
          # scripts/sync-constitution.sh and commit the result: the two are not
          # allowed to drift (rule 7, one source of truth).
          scripts/sync-constitution.sh
          git diff --exit-code -- .specify/memory/constitution.md
      - name: Public documentation matches the shipped paths and version
        run: bash scripts/check-public-surface.sh
      - name: Every shipped contract lints clean
        run: |
          cargo build --release
          uni="$PWD/target/release/uni"
          rc=0
          # `uni lint` resolves the registry from the working directory, so a
          # contract that carries its own `.uni/config.toml` (an example that
          # pins its own verifiers) must be linted from where it lives, or every
          # reference looks unknown.
          for f in $(find examples uni packs -type f -name '*.uni' | sort); do
            dir=$(dirname "$f")
            echo "--- $f"
            if [ -f "$dir/.uni/config.toml" ]; then
              (cd "$dir" && "$uni" lint "$(basename "$f")") || rc=1
            else
              "$uni" lint "$f" || rc=1
            fi
          done
          exit $rc

  # One stable required check. A matrix may pass partially; every required
  # upstream job must report success for the protected branch to advance.
  required-gate:
    name: UNI required checks
    if: ${{ always() && github.ref_type != 'tag' }}
    needs: [matrix, examples-posix, action-smoke, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Assert every required job succeeded
        env:
          CORE: ${{ needs.matrix.result }}
          EXAMPLES: ${{ needs.examples-posix.result }}
          ACTION: ${{ needs.action-smoke.result }}
          LINT: ${{ needs.lint.result }}
        shell: bash
        run: |
          echo "Core matrix: $CORE"
          echo "Cross-stack examples: $EXAMPLES"
          echo "Published action: $ACTION"
          echo "Lint and policy: $LINT"
          test "$CORE" = success
          test "$EXAMPLES" = success
          test "$ACTION" = success
          test "$LINT" = success
