[workspace]
members = [
  "crates/uni-parser",
  "crates/uni-ir",
  "crates/uni-evidence",
  "crates/uni-verify",
  "crates/uni-decision",
  "crates/uni-cli",
]
resolver = "2"

[workspace.package]
version = "0.9.4"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/memolabs-dev/uni-protocol"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
wait-timeout = "0.2"
# Identity adapter (A3). Pure-Rust crypto backend so the cross-compiled release
# binaries pull no C/asm toolchain; exactly one backend feature is required.
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto", "use_pem"] }
